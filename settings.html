<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paramètres - Arcade</title>
    
    <style>
        /* --- STYLE --- */
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-light: #334155;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--surface-light);
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; padding: 0; margin: 0; flex-shrink: 0; }
        .logo { font-size: 1.1rem; font-weight: bold; color: var(--primary); flex-grow: 1; text-align: center; }

        /* --- CONTENT --- */
        .content { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .card {
            background: var(--surface-color); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--surface-light); box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h3 { margin-top: 0; color: var(--text-main); }

        /* --- SLIDERS --- */
        .setting-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .setting-label { display: flex; justify-content: space-between; font-size: 1.1rem; }
        .vol-value { color: var(--primary); font-weight: bold; }

        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: var(--primary); cursor: pointer; margin-top: -8px; box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: var(--surface-light); border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }

        /* --- MENU --- */
        #side-menu {
            position: fixed; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--surface-color); transform: translateX(-100%); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40; 
            display: flex; flex-direction: column; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #side-menu.open { transform: translateX(0); }
        .menu-header { padding: 20px; background: var(--primary); color: white; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .menu-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .menu-item a {
            display: block; padding: 15px 20px; color: var(--text-main); text-decoration: none;
            border-bottom: 1px solid var(--surface-light); transition: background 0.2s; font-size: 1rem;
        }
        .menu-item a:hover { background: var(--surface-light); }
        .menu-item a.active { color: var(--primary); border-left: 4px solid var(--primary); background: rgba(139, 92, 246, 0.1); }

        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 35; display: none; opacity: 0; transition: opacity 0.3s;
        }
        #menu-overlay.show { display: block; opacity:1; }
        
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface-light); padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div id="toast">Message</div>

    <!-- MENU -->
    <div id="side-menu">
        <div class="menu-header">
            <span>Arcade</span>
            <button class="close-btn" onclick="toggleMenu()" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">×</button>
        </div>
        <ul class="menu-list" id="menu-list-container"></ul>
    </div>
    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div id="app-container">
        <header>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <div class="logo">Paramètres</div>
            <div style="width: 50px;"></div> 
        </header>

        <div class="content">
            <div class="card">
                <h3>Audio</h3>
                
                <div class="setting-row">
                    <div class="setting-label">
                        <span>Volume Effets (Jeu / Chat)</span>
                        <span class="vol-value" id="val-sfx">100%</span>
                    </div>
                    <input type="range" min="0" max="1" step="0.1" value="1" id="sfx-slider" oninput="updateSfx(this.value)">
                </div>
                
                <div class="setting-row">
                    <div class="setting-label">
                        <span>Volume Musique</span>
                        <span class="vol-value" id="val-music">100%</span>
                    </div>
                    <input type="range" min="0" max="1" step="0.1" value="1" id="music-slider" oninput="updateMusic(this.value)">
                </div>

                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:10px;">
                    💡 Astuce : Mets un fichier nommé <strong>bgm.m4a</strong> dans le dossier GitHub pour changer la musique.
                </p>
            </div>
            
            <div class="card" style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                Version 1.2 (Audio M4A)
            </div>
        </div>
    </div>

    <script>
        // --- GESTION MENU ---
        async function initMenu() {
            const listContainer = document.getElementById('menu-list-container');
            listContainer.innerHTML = '<li style="padding:15px; color:#666; text-align:center;">Chargement...</li>';
            try {
                const response = await fetch('menu.json');
                if (!response.ok) throw new Error("Fichier non trouvé");
                const menuData = await response.json();
                listContainer.innerHTML = '';
                menuData.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'menu-item';
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.innerText = item.title;
                    if (item.title.includes("Paramètres")) a.classList.add('active');
                    li.appendChild(a);
                    listContainer.appendChild(li);
                });
            } catch (error) {
                listContainer.innerHTML = '<li style="padding:15px; color:red; text-align:center;">Erreur menu</li>';
            }
        }
        initMenu();

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.remove('show');
            } else {
                menu.classList.add('open');
                overlay.classList.add('show');
            }
        }

        // --- LOGIQUE PARAMÈTRES ---
        let soundEnabled = true; // Par défaut true pour SFX
        let musicEnabled = true; // Par défaut true

        // Chargement des états
        let sfxVolume = parseFloat(localStorage.getItem('sfxVolume')) || 1;
        let musicVolume = parseFloat(localStorage.getItem('musicVolume')) || 1;

        // Mettre à jour les boutons visuels
        document.getElementById('sfx-slider').value = sfxVolume;
        document.getElementById('val-sfx').innerText = Math.round(sfxVolume * 100) + '%';
        
        document.getElementById('music-slider').value = musicVolume;
        document.getElementById('val-music').innerText = Math.round(musicVolume * 100) + '%';

        function updateSfx(val) {
            sfxVolume = parseFloat(val);
            document.getElementById('val-sfx').innerText = Math.round(sfxVolume * 100) + '%';
            localStorage.setItem('sfxVolume', sfxVolume);
        }

        function updateMusic(val) {
            musicVolume = parseFloat(val);
            document.getElementById('val-music').innerText = Math.round(musicVolume * 100) + '%';
            localStorage.setItem('musicVolume', musicVolume);
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
