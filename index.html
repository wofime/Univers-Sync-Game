<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindSync - Jeu de Synchro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        /* --- STYLE --- */
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-light: #334155;
            --primary: #8b5cf6;
            --secondary: #ec4899;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--bg-color);
        }

        /* --- HEADER --- */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--surface-light);
            flex-shrink: 0;
            z-index: 20;
            position: relative;
        }

        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; padding: 0; margin: 0; flex-shrink: 0; }
        .logo { font-size: 1.1rem; font-weight: bold; color: var(--primary); flex-grow: 1; text-align: center; }
        .score { background: var(--surface-light); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; flex-shrink: 0; }

        /* --- VIEWS --- */
        .view { flex: 1; display: none; flex-direction: column; padding: 20px; overflow-y: hidden; }
        .view.active { display: flex; }

        /* --- CARDS & INPUTS --- */
        .card {
            background: var(--surface-color); border-radius: var(--radius); padding: 20px; text-align: center;
            margin-bottom: 20px; border: 1px solid var(--surface-light); box-shadow: 0 4px 6px rgba(0,0,0,0.3); flex-shrink: 0;
        }

        input[type="text"], input[type="number"] {
            width: 100%; padding: 15px; border-radius: 8px; border: 1px solid var(--surface-light);
            background: #020617; color: white; font-size: 1.5rem; margin-bottom: 10px;
            outline: none; letter-spacing: 2px; font-weight: bold; text-align: center;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); }
        
        #my-id.loaded { border-color: var(--success); color: var(--success); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        input[readonly] { background: var(--surface-light); letter-spacing: 5px; cursor: pointer; }

        button {
            width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold;
            cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 10px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .btn-primary:disabled { background: var(--surface-light); opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-secondary { background: var(--surface-light); color: white; margin-top: auto; }
        .btn-small { font-size: 0.8rem; padding: 8px; background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); width: auto; align-self: center; }

        /* --- GAME BOARD --- */
        .game-board { display: flex; justify-content: space-between; margin: 10px 0 20px 0; flex-shrink: 0; }
        .game-card { width: 48%; aspect-ratio: 3/4; perspective: 1000px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 12px; border: 2px solid var(--surface-light);
        }
        .card-front { background: var(--surface-color); }
        .card-back { background: var(--primary); color: white; transform: rotateY(180deg); border-color: var(--primary); }
        .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .word { font-size: 1.2rem; font-weight: bold; margin-top: 5px; word-break: break-word; }
        .ready-indicator { width: 10px; height: 10px; background: var(--text-muted); border-radius: 50%; margin-top: 10px; transition: 0.3s; }
        .game-card.ready .ready-indicator { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .game-card.ready .card-front { border-color: var(--success); }

        /* --- CHAT --- */
        #fab-chat {
            position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px;
            border-radius: 50%; background: var(--secondary); color: white; border: none; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 25;
        }
        #chat-badge {
            position: absolute; top: -5px; right: -5px; background: #ef4444; color: white;
            font-size: 0.75rem; font-weight: bold; height: 20px; min-width: 20px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--bg-color);
            display: none; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        #chat-panel {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
            background: var(--surface-color); transition: 0.3s; display: flex; flex-direction: column;
            border-left: 2px solid var(--surface-light); z-index: 20;
        }
        #chat-panel.open { right: 0; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; max-width: 80%; animation: popIn 0.2s; }
        .msg-me { align-self: flex-end; background: var(--primary); color: white; }
        .msg-friend { align-self: flex-start; background: var(--surface-light); color: white; }
        .chat-header { padding: 15px; background: #0f172a; display: flex; justify-content: space-between; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; width: auto; }

        /* --- MENU LATÉRAL --- */
        #side-menu {
            position: fixed; top: 0; left: 0; width: 280px; height: 100%;
            background: var(--surface-color); transform: translateX(-100%); 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40; 
            display: flex; flex-direction: column; box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #side-menu.open { transform: translateX(0); }
        .menu-header { padding: 20px; background: var(--primary); color: white; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .menu-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .menu-item a {
            display: block; padding: 15px 20px; color: var(--text-main); text-decoration: none;
            border-bottom: 1px solid var(--surface-light); transition: background 0.2s; font-size: 1rem;
        }
        .menu-item a:hover { background: var(--surface-light); }
        .menu-item a.active { color: var(--primary); border-left: 4px solid var(--primary); background: rgba(139, 92, 246, 0.1); }
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 35; display: none; opacity: 0; transition: opacity 0.3s;
        }
        #menu-overlay.show { display: block; opacity:1; }

        /* --- TOAST --- */
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface-light); padding: 10px 20px; border-radius: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        #toast.show { opacity: 1; }

        #victory-text { text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; min-height: 40px; flex-shrink: 0; }
        .win { color: var(--success); animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
    </style>
</head>
<body>

    <!-- ÉLÉMENT AUDIO CACHÉ POUR LA MUSIQUE FICHIER -->
    <!-- Charge bgm.m4a maintenant -->
    <audio id="bgm-element" loop></audio>

    <div id="toast">Message</div>

    <!-- MENU -->
    <div id="side-menu">
        <div class="menu-header">
            <span>Arcade</span>
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        <ul class="menu-list" id="menu-list-container"></ul>
    </div>
    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div id="app-container">
        <header>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <div class="logo">MindSync</div>
            <div class="score">Score: <span id="score">0</span></div>
        </header>

        <!-- ÉCRAN 1 : LOBBY -->
        <div id="view-lobby" class="view active">
            <div class="card">
                <h3>Ton Code</h3>
                <p style="color: var(--text-muted); font-size: 0.8rem;">Clique sur le code pour copier :</p>
                <input type="text" id="my-id" readonly value="Initialisation..." onclick="this.select()">
                
                <button class="btn-small" onclick="forceNewCode()">Forcer nouveau code</button>
                
                <hr style="border: 0; border-top: 1px solid #334155; margin: 20px 0;">
                
                <p style="color: var(--text-muted); font-size: 0.8rem;">Code de l'ami :</p>
                <input type="number" id="friend-id" placeholder="Ex: 12345">
                <button class="btn-primary" onclick="connect()">JOUER</button>
            </div>
        </div>

        <!-- ÉCRAN 2 : JEU -->
        <div id="view-game" class="view">
            <div id="victory-text"></div>

            <div class="game-board">
                <!-- Carte Moi -->
                <div class="game-card" id="card-me">
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="label">Moi</span>
                            <div class="word" id="me-word-front">?</div>
                            <div class="ready-indicator"></div>
                        </div>
                        <div class="card-back">
                            <span class="label">Mot</span>
                            <div class="word" id="me-word-back"></div>
                        </div>
                    </div>
                </div>

                <!-- Carte Ami -->
                <div class="game-card" id="card-friend">
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="label">Ami</span>
                            <div class="word" id="friend-word-front">?</div>
                            <div class="ready-indicator"></div>
                        </div>
                        <div class="card-back">
                            <span class="label">Mot</span>
                            <div class="word" id="friend-word-back"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <input type="text" id="game-input" placeholder="Ton mot secret..." oninput="updateInput()">
                <button id="btn-ready" class="btn-primary" onclick="sendWord()" disabled>PRÊT</button>
            </div>

            <button id="btn-next" class="btn-secondary" onclick="resetRound()" style="display:none;">Continuer</button>
        </div>
    </div>

    <!-- CHAT -->
    <button id="fab-chat" onclick="toggleChat()">
        💬
        <div id="chat-badge">0</div>
    </button>
    <div id="chat-panel">
        <div class="chat-header">
            <span>Chat</span>
            <button class="close-btn" onclick="toggleChat()">×</button>
        </div>
        <div id="chat-messages"></div>
        <div style="padding: 10px;">
            <input type="text" id="chat-input" placeholder="Msg..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="btn-primary" style="margin-top: 5px;" onclick="sendChat()">Envoyer</button>
        </div>
    </div>

    <script>
        // --- 1. SYSTÈME AUDIO COMPLET (M4A support) ---
        const AudioEngine = {
            ctx: null,
            bgmElement: document.getElementById('bgm-element'),
            bgmVolume: 0.5,
            sfxVolume: 1.0,
            isInitialized: false,

            init: function() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.isInitialized = true;
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                // Charger les préférences volume
                this.sfxVolume = parseFloat(localStorage.getItem('sfxVolume')) || 1.0;
                this.bgmVolume = parseFloat(localStorage.getItem('musicVolume')) || 1.0;
                
                // Appliquer le volume à l'élément
                this.bgmElement.volume = this.bgmVolume;
            },

            playTone: function(freq, type, duration, volMultiplier = 1) {
                if (this.sfxVolume <= 0 || !this.isInitialized) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                // Volume Master SFX (applique le volume du slider)
                gain.gain.setValueAtTime(0.1 * this.sfxVolume * volMultiplier, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },

            // Effets Jeu
            playFlip: function() { 
                this.playTone(400, 'sine', 0.2, 1.5); 
                this.playTone(600, 'triangle', 0.2, 1.5); 
            },
            playWin: function() { 
                this.playTone(523.25, 'sine', 0.6, 1.5);
                setTimeout(() => this.playTone(659.25, 'sine', 0.6, 1.5), 100);
                setTimeout(() => this.playTone(783.99, 'sine', 0.8, 1.5), 200);
            },
            playLose: function() { 
                this.playTone(200, 'sawtooth', 0.6, 2.0);
            },
            playChat: function() {
                this.playTone(800, 'square', 0.1, 0.8);
            },

            // Musique de fond (Fichier M4A)
            startMusic: function() {
                if (this.bgmVolume <= 0) return;
                
                // Chargement du fichier M4A
                this.bgmElement.src = 'bgm.m4a';
                this.bgmElement.volume = this.bgmVolume;
                
                // Gestion d'erreur si fichier pas là
                this.bgmElement.onerror = () => {
                    console.log("Fichier bgm.m4a introuvable. Musique désactivée.");
                    this.stopMusic();
                };

                const playPromise = this.bgmElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        // Lecture démarrée
                    }).catch(error => {
                        console.error("Erreur lecture BGM:", error);
                    });
                }
            },

            stopMusic: function() {
                this.bgmElement.pause();
                this.bgmElement.currentTime = 0;
            },

            // Mise à jour volume depuis les paramètres
            updateMusicVolume: function(val) {
                this.bgmVolume = parseFloat(val);
                this.bgmElement.volume = this.bgmVolume;
                if (this.bgmVolume > 0 && document.getElementById('view-game').classList.contains('active')) {
                    this.startMusic();
                } else {
                    this.stopMusic();
                }
            },
            
            updateSfxVolume: function(val) {
                this.sfxVolume = parseFloat(val);
            },

            toggleMusicState: function() {
                if (this.bgmVolume > 0 && document.getElementById('view-game').classList.contains('active')) {
                    this.startMusic();
                } else {
                    this.stopMusic();
                }
            }
        };

        // --- 2. GESTION VUES & MENU ---
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            if (viewId === 'view-game') {
                AudioEngine.init();
                AudioEngine.toggleMusicState();
            } else {
                AudioEngine.stopMusic();
            }
        }

        async function initMenu() {
            const listContainer = document.getElementById('menu-list-container');
            listContainer.innerHTML = '<li style="padding:15px; color:#666; text-align:center;">Chargement...</li>';
            try {
                const response = await fetch('menu.json');
                if (!response.ok) throw new Error("Fichier non trouvé");
                const menuData = await response.json();
                listContainer.innerHTML = '';
                menuData.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'menu-item';
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.innerText = item.title;
                    if (item.active) a.classList.add('active');
                    if (item.url.startsWith('#')) {
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            const targetId = item.url.substring(1);
                            if(targetId === 'game') showView('view-game');
                            toggleMenu();
                        });
                    }
                    li.appendChild(a);
                    listContainer.appendChild(li);
                });
            } catch (error) {
                listContainer.innerHTML = '<li style="padding:15px; color:red; text-align:center;">Erreur menu</li>';
            }
        }
        initMenu();

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.classList.remove('show');
            } else {
                menu.classList.add('open');
                overlay.classList.add('show');
            }
        }

        // --- 3. VARIABLES JEU ---
        let peer, conn = null, myWord = "", friendWord = "", score = 0, readyMe = false, readyFriend = false;
        let isChatOpen = false, unreadCount = 0;
        
        // Audio vars loaded from settings
        // Note: Le code settings gère le localStorage, AudioEngine le lit ici.

        const els = {
            lobby: document.getElementById('view-lobby'),
            game: document.getElementById('view-game'),
            myId: document.getElementById('my-id'),
            friendId: document.getElementById('friend-id'),
            gameInput: document.getElementById('game-input'),
            btnReady: document.getElementById('btn-ready'),
            btnNext: document.getElementById('btn-next'),
            score: document.getElementById('score'),
            victory: document.getElementById('victory-text'),
            meCard: document.getElementById('card-me'),
            friendCard: document.getElementById('card-friend'),
            chatPanel: document.getElementById('chat-panel'),
            chatMsgs: document.getElementById('chat-messages'),
            chatInput: document.getElementById('chat-input'),
            badge: document.getElementById('chat-badge')
        };

        // --- 4. LOGIQUE JEU ---
        function forceNewCode() { initShortPeer(); }

        function initShortPeer() {
            if (peer && !peer.destroyed) { peer.destroy(); peer = null; }
            els.myId.value = "Génération...";
            els.myId.classList.remove('loaded');
            const shortId = Math.floor(10000 + Math.random() * 90000).toString();
            try {
                peer = new Peer(shortId);
                peer.on('open', (id) => {
                    els.myId.value = id;
                    els.myId.classList.add('loaded');
                    showToast("Code généré : " + id);
                });
                peer.on('error', (err) => {
                    if (err.type === 'unavailable-id') initShortPeer();
                    else if (err.type === 'peer-unavailable') alert("Ami hors ligne");
                    else els.myId.value = "Erreur";
                });
                peer.on('connection', (c) => {
                    conn = c;
                    setupConn();
                    showView('view-game');
                });
            } catch(e) { setTimeout(initShortPeer, 2000); }
        }
        initShortPeer();

        function connect() {
            const id = els.friendId.value.trim();
            if(!id) return alert("Entre un code");
            if(!peer || peer.destroyed) return alert("Erreur connexion.");
            conn = peer.connect(id);
            conn.on('open', () => { setupConn(); showView('view-game'); });
            conn.on('error', () => alert("Connexion échouée."));
        }

        function setupConn() {
            conn.on('data', (data) => {
                if (data.type === 'WORD') {
                    friendWord = data.val;
                    readyFriend = true;
                    els.friendCard.classList.add('ready');
                    document.getElementById('friend-word-front').innerText = "PRÊT";
                    checkReady();
                } else if (data.type === 'CHAT') {
                    if (!isChatOpen) {
                        unreadCount++;
                        updateBadge();
                        AudioEngine.playChat();
                    }
                    addMsg(data.val, 'friend');
                }
            });
            conn.on('close', () => alert("Déconnecté"));
        }

        function updateInput() {
            myWord = els.gameInput.value.trim();
            els.btnReady.disabled = myWord === "";
            document.getElementById('me-word-front').innerText = myWord || "?";
        }

        function sendWord() {
            if(!conn) return;
            readyMe = true;
            els.meCard.classList.add('ready');
            els.gameInput.disabled = true;
            els.btnReady.style.display = 'none';
            conn.send({ type: 'WORD', val: myWord });
            checkReady();
        }

        function checkReady() {
            if (readyMe && readyFriend) setTimeout(revealCards, 500);
        }

        function revealCards() {
            AudioEngine.playFlip();

            document.getElementById('me-word-back').innerText = myWord;
            document.getElementById('friend-word-back').innerText = friendWord;
            document.querySelector('#card-me .card-inner').classList.add('flipped');
            document.querySelector('#card-friend .card-inner').classList.add('flipped');

            if (myWord.toLowerCase() === friendWord.toLowerCase()) {
                score++;
                els.score.innerText = score;
                els.victory.innerText = "SYNCHRO !";
                els.victory.className = "win";
                els.btnNext.innerText = "Recommencer";
                AudioEngine.playWin();
            } else {
                els.victory.innerText = "";
                els.victory.className = "";
                els.btnNext.innerText = "Continuer";
                AudioEngine.playLose();
            }
            els.btnNext.style.display = 'block';
        }

        function resetRound() {
            readyMe = false; readyFriend = false; myWord = ""; friendWord = "";
            document.querySelector('#card-me .card-inner').classList.remove('flipped');
            document.querySelector('#card-friend .card-inner').classList.remove('flipped');
            
            setTimeout(() => {
                document.getElementById('me-word-front').innerText = "?";
                document.getElementById('friend-word-front').innerText = "?";
                els.gameInput.value = "";
                els.gameInput.disabled = false;
                els.btnReady.style.display = 'block';
                els.btnReady.disabled = true;
                els.btnNext.style.display = 'none';
                els.meCard.classList.remove('ready');
                els.friendCard.classList.remove('ready');
                els.victory.style.display = 'none';
                els.victory.className = "";
                els.gameInput.focus();
            }, 300);
        }

        // --- CHAT ---
        function toggleChat() { 
            isChatOpen = !isChatOpen;
            els.chatPanel.classList.toggle('open'); 
            if (isChatOpen) { unreadCount = 0; updateBadge(); }
        }
        
        function sendChat() {
            const txt = els.chatInput.value.trim();
            if(!txt || !conn) return;
            conn.send({ type: 'CHAT', val: txt });
            addMsg(txt, 'me');
            els.chatInput.value = "";
        }

        function addMsg(txt, who) {
            const d = document.createElement('div');
            d.className = `msg msg-${who}`;
            d.innerText = txt;
            els.chatMsgs.appendChild(d);
            els.chatMsgs.scrollTop = els.chatMsgs.scrollHeight;
        }

        function updateBadge() {
            if (unreadCount > 0) {
                els.badge.innerText = unreadCount;
                els.badge.style.display = 'flex';
            } else {
                els.badge.style.display = 'none';
            }
        }

        function showToast(txt) {
            const t = document.getElementById('toast');
            t.innerText = txt;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // --- Écouteur d'événements storage ---
        window.addEventListener('storage', (e) => {
            if (e.key === 'sfxVolume') AudioEngine.updateSfxVolume(e.newValue);
            if (e.key === 'musicVolume') AudioEngine.updateMusicVolume(e.newValue);
        });
    </script>
</body>
</html>
